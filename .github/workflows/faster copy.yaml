name: Copy/Update Branch

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL of the branch to copy'
        required: true
        type: string
      new_branch_name:
        description: 'Name for the new branch (optional, default is "copy-<target-branch-name>")'
        required: false
        type: string

jobs:
  sync-branch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the Froggerpilot Repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.FROGGERPILOT_PAT }}
        repository: Froggerpilot/openpilot
        ref: FrogPilot
        fetch-depth: 1  # Optimize: Only fetch latest commit

    - name: Extract Target Repo and Branch
      id: extract-info
      run: |
        echo "TARGET_URL=${{ github.event.inputs.target_url }}" >> $GITHUB_ENV
        TARGET_URL=${{ github.event.inputs.target_url }}
        TARGET_REPO=$(echo $TARGET_URL | sed -E 's|https://github.com/([^/]+/[^/]+).*|\1|')
        TARGET_BRANCH=$(echo $TARGET_URL | sed -E 's|https://github.com/[^/]+/[^/]+/tree/(.+)|\1|')
        echo "TARGET_REPO=${TARGET_REPO}" >> $GITHUB_ENV
        echo "TARGET_BRANCH=${TARGET_BRANCH}" >> $GITHUB_ENV
        echo "Target Repository: $TARGET_REPO"
        echo "Target Branch: $TARGET_BRANCH"

    - name: Generate Branch Name
      id: generate-branch-name
      run: |
        if [ -z "${{ github.event.inputs.new_branch_name }}" ]; then
          NEW_BRANCH_NAME="copy-${TARGET_BRANCH}"
        else
          NEW_BRANCH_NAME="${{ github.event.inputs.new_branch_name }}"
        fi
        echo "NEW_BRANCH_NAME=${NEW_BRANCH_NAME}" >> $GITHUB_ENV
        echo "New Branch Name: ${NEW_BRANCH_NAME}"

    - name: Clone External Repository (Shallow, Single Branch)
      run: |
        git clone --depth=1 --single-branch --branch=${TARGET_BRANCH} https://github.com/${{ env.TARGET_REPO }} external-repo
      env:
        TARGET_REPO: ${{ env.TARGET_REPO }}
        TARGET_BRANCH: ${{ env.TARGET_BRANCH }}

    - name: Create and Push New Branch to Froggerpilot Repository
      run: |
        cd external-repo
        git remote remove origin
        git remote add origin https://x-access-token:${{ secrets.FROGGERPILOT_PAT }}@github.com/Froggerpilot/openpilot.git
        git checkout -b ${{ env.NEW_BRANCH_NAME }}
        
        # Check if branch exists before pushing
        if git ls-remote --heads origin ${{ env.NEW_BRANCH_NAME }} | grep ${{ env.NEW_BRANCH_NAME }}; then
          echo "Branch already exists. Skipping push."
        else
          git push origin ${{ env.NEW_BRANCH_NAME }}
        fi
      env:
        TARGET_REPO: ${{ env.TARGET_REPO }}
        TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
        GITHUB_TOKEN: ${{ secrets.FROGGERPILOT_PAT }}
        NEW_BRANCH_NAME: ${{ env.NEW_BRANCH_NAME }}
