name: Faster Copy/Update Branch

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL of the branch to copy'
        required: true
        type: string
      new_branch_name:
        description: 'Name for the new branch (optional, default is "copy-<target-branch-name>")'
        required: false
        type: string

jobs:
  sync-branch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the Froggerpilot Repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.FROGGERPILOT_PAT }}
        repository: Froggerpilot/openpilot
        ref: FrogPilot
        fetch-depth: 1

    - name: Extract Target Repo and Branch
      id: extract-info
      run: |
        TARGET_URL="${{ github.event.inputs.target_url }}"
        TARGET_REPO=$(echo $TARGET_URL | cut -d'/' -f4,5)
        TARGET_BRANCH=$(echo $TARGET_URL | sed -E 's|.*/tree/(.*)|\1|')

        echo "TARGET_REPO=${TARGET_REPO}" >> $GITHUB_ENV
        echo "TARGET_BRANCH=${TARGET_BRANCH}" >> $GITHUB_ENV
        echo "Target Repository: ${TARGET_REPO}"
        echo "Target Branch: ${TARGET_BRANCH}"

    - name: Fetch and Checkout Target Branch
      run: |
        git remote add target https://github.com/${{ env.TARGET_REPO }}.git
        git fetch --depth=1 target ${{ env.TARGET_BRANCH }}:${{ env.TARGET_BRANCH }}
        git checkout ${{ env.TARGET_BRANCH }}
      env:
        TARGET_REPO: ${{ env.TARGET_REPO }}
        TARGET_BRANCH: ${{ env.TARGET_BRANCH }}

    - name: Generate New Branch Name
      id: generate-branch-name
      run: |
        if [ -z "${{ github.event.inputs.new_branch_name }}" ]; then
          NEW_BRANCH_NAME="copy-${{ env.TARGET_BRANCH }}"
        else
          NEW_BRANCH_NAME="${{ github.event.inputs.new_branch_name }}"
        fi
        echo "NEW_BRANCH_NAME=${NEW_BRANCH_NAME}" >> $GITHUB_ENV
        echo "New Branch Name: ${NEW_BRANCH_NAME}"

    - name: Create and Push New Branch
      run: |
        git checkout -b ${{ env.NEW_BRANCH_NAME }}
        git remote set-url origin https://x-access-token:${{ secrets.FROGGERPILOT_PAT }}@github.com/Froggerpilot/openpilot.git
        git push --set-upstream origin ${{ env.NEW_BRANCH_NAME }}
      env:
        NEW_BRANCH_NAME: ${{ env.NEW_BRANCH_NAME }}
        FROGGERPILOT_PAT: ${{ secrets.FROGGERPILOT_PAT }}
